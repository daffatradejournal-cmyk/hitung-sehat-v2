    <rect x="114" y="145" width="46" height="182" rx="23" fill="#ffffff" />
    <rect x="114" y="214" width="112" height="44" rx="20" fill="#ffffff" />
    <rect x="180" y="145" width="46" height="182" rx="23" fill="#ffffff" />

    <!-- Letter S -->
    <path d="M 344 178 C 344 154 320 138 290 138 C 260 138 238 153 238 178 C 238 206 262 218 286 226 C 316 235 346 248 346 280 C 346 312 318 334 282 334 C 246 334 222 316 219 286" 
          fill="none" stroke="#ffffff" stroke-width="44" stroke-linecap="round" stroke-linejoin="round" />

    <!-- Fresh Leaf Flourish -->
    <path d="M 324 108 C 362 108 382 134 382 134 C 382 134 356 152 318 152 C 318 134 324 108 324 108 Z" fill="#86efac" />
    <path d="M 324 140 L 354 122" stroke="#15803d" stroke-width="4" stroke-linecap="round" />
