<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 440 100" width="440" height="100">
  <defs>
    <linearGradient id="hsGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#22c55e" />
      <stop offset="60%" stop-color="#16a34a" />
      <stop offset="100%" stop-color="#15803d" />
    </linearGradient>
    <filter id="hsShadow" x="-10%" y="-10%" width="125%" height="125%">
      <feDropShadow dx="0" dy="6" stdDeviation="8" flood-color="#15803d" flood-opacity="0.25" />
    </filter>
  </defs>

  <!-- Squircle Base -->
  <g transform="translate(10, 10)">
    <rect width="80" height="80" rx="22" fill="url(#hsGrad)" filter="url(#hsShadow)" />
    <rect x="2" y="2" width="76" height="76" rx="20" fill="none" stroke="#ffffff" stroke-width="2" stroke-opacity="0.3" />
    
    <!-- Monogram HS -->
    <text x="40" y="55" font-family="system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-weight="900" font-size="34" fill="#ffffff" text-anchor="middle" letter-spacing="-1">HS</text>
    
    <!-- Fresh Leaf Flourish -->
    <path d="M 58 12 C 68 12 74 20 74 20 C 74 20 66 26 56 26 C 56 20 58 12 58 12 Z" fill="#86efac" />
    <path d="M 58 22 L 67 16" stroke="#15803d" stroke-width="2" stroke-linecap="round" />
  </g>

  <!-- Typography -->
  <!-- "Hitung Sehat" -->
  <text x="108" y="56" font-family="system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-weight="800" font-size="34" fill="#0f172a" letter-spacing="-0.5">
    Hitung <tspan fill="#22c55e">Sehat</tspan>
  </text>

  <!-- Subtitle Badge -->
  <rect x="108" y="66" width="162" height="22" rx="6" fill="#dcfce7" />
  <text x="116" y="81" font-family="system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-weight="700" font-size="10.5" fill="#15803d" letter-spacing="1.2">
    AI NUTRITION TRACKER
  </text>
</svg>
